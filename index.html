      ['w2', 'Per-screen weight', 0, 100, 5, function (s) { return s.v.w[2] * 100; }, function (s, x) { s.v.w[2] = x / 100; }, function (x) { return x.toFixed(0); }]]]
  ];
  function liveRanges(r) {
    var v = ST.v, bear = IM.value(IM.CASES.bear, v, ST.n), bull = IM.value(IM.CASES.bull, v, ST.n), nd = r.ded, f25 = IM.hist(2025).adj;
    function rg(n, lo, hi, b) { return { name: n, lo: Math.min(lo, hi, b === null ? lo : b), hi: Math.max(lo, hi, b === null ? hi : b), base: b }; }
    return [rg('Indicative price', bear.eq, bull.eq, r.eq), rg('DCF', bear.eqDcf, bull.eqDcf, r.eqDcf), rg('EV / EBITDA', 4 * r.ltm - nd, 6 * r.ltm - nd, r.eqMult), rg('Per screen', 250000 * IM.NSCREENS - nd, 400000 * IM.NSCREENS - nd, r.eqScr), rg('Adviser range', 3 * f25 - nd, 6 * f25 - nd, null)];
  }
  function liveChecks(r, R) {
    var c = [], near = function (a, b) { return Math.abs(a - b) < 1; }, ws = r.w[0] + r.w[1] + r.w[2];
    function ok(t, p) { c.push([t, !!p]); }
    ok('Method weights add to 100%', Math.abs(ws - 1) < 1e-9);
    ok('Enterprise value equals the weighted methods', near(r.ev, r.w[0] * r.dcf + r.w[1] * r.evMult + r.w[2] * r.evScr));
    ok('Equity plus deductions equals enterprise value', near(r.eq + r.ded, r.ev));
    ok('Deductions equal net debt, catch-up and working capital', near(r.ded, r.netDebt + r.catchup + r.nwc));
    ok('Every forecast year: revenue equals admissions, concessions and other', r.rows.every(function (x) { return near(x.rev, x.adm + x.con + x.oth); }));
    ok('Every forecast year: EBITDA equals gross profit less operating expenses', r.rows.every(function (x) { return near(x.ebitda, x.gp - x.opex); }));
    ok('Debt falls by the principal repaid each year', r.rows.every(function (x, i) { return i === 0 || near(r.rows[i - 1].debtEnd - x.debtEnd, x.prin); }));
    ok('Base value sits inside each football-field range', R.every(function (x) { return x.base === null || (x.base >= x.lo - 1 && x.base <= x.hi + 1); }));
    ok('Terminal growth is below the discount rate', ST.v.g < ST.v.r);
    var m = IM.runChecks(); ok('Saved-case model checks: ' + m.filter(function (x) { return x.pass; }).length + ' of ' + m.length + ' pass', m.every(function (x) { return x.pass; }));
    return c;
  }
  function renderOut() {
    var r = IM.value(ST.p, ST.v, ST.n), R = liveRanges(r), offer = ST.v.offer;
    var kp = function (k, v, s) { return '<div class="card kpi"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="s">' + s + '</div></div>'; };
    var diff = r.eq - offer;
    var h = '<div class="grid g2">' + kp('Equity value', $f(r.eq), 'Buyer cash if debt stays') + kp('Enterprise value', $f(r.ev), U.mx(r.evToLtm) + ' FY2026E, ' + U.mx(r.evToFy25) + ' FY2025') + kp('Versus client’s offer', (diff >= 0 ? '+' : '−') + $f(Math.abs(diff)).replace('$', '$'), diff >= 0 ? 'Model value is above the offer' : 'Model value is below the offer') + kp('Equity plus fees', $f(r.buyerEq), 'Equity plus ' + (ST.v.fees * 100).toFixed(1) + '% fees on EV') + '</div>';
    h += '<h3>Method values</h3>' + U.tbl(['Method', 'Enterprise value', 'Equity value', 'Weight'], [['DCF', $f(r.dcf), $f(r.eqDcf), (r.w[0] * 100).toFixed(0) + '%'], ['EV / EBITDA', $f(r.evMult), $f(r.eqMult), (r.w[1] * 100).toFixed(0) + '%'], ['Per screen', $f(r.evScr), $f(r.eqScr), (r.w[2] * 100).toFixed(0) + '%'], { cls: 'tot', c: ['Weighted', $f(r.ev), $f(r.eq), '100%'] }]);
    if (ST.v.w[0] + ST.v.w[1] + ST.v.w[2] === 0) h += '<p class="note">All three weights are zero, so equal weights are used.</p>';
    h += '<p class="note">Terminal value is ' + (r.tvShare * 100).toFixed(0) + '% of the DCF. Deductions: net debt ' + $f(r.netDebt) + ', catch-up ' + $f(r.catchup) + ', working capital ' + $f(r.nwc) + '.</p>';
    h += '<h3>Football field</h3><div class="chartbox">' + U.football(R, offer) + '</div><p>' + window.offerSentence(R, offer) + '.</p><p class="note">Bear and bull ranges use the saved case assumptions with your valuation settings.</p>';
    h += '<h3>Forecast</h3>' + U.tbl(['', 'FY2026E'].concat(r.rows.slice(1).map(function (x) { return 'FY' + x.yr + 'E'; })), [['Revenue'].concat(r.rows.map(function (x) { return $f(x.rev); })), { cls: 'tot', c: ['Adjusted EBITDA'].concat(r.rows.map(function (x) { return $f(x.ebitda); })) }, ['Free cash flow'].concat(r.rows.map(function (x) { return $f(x.fcf); })), ['Debt at year end'].concat(r.rows.map(function (x) { return $f(x.debtEnd); }))]);
    var cks = liveChecks(r, R), pass = cks.filter(function (x) { return x[1]; }).length;
    h += '<h3>Live checks: ' + pass + ' of ' + cks.length + ' pass</h3><div class="card">' + cks.map(function (x) { return '<div class="chk"><span class="' + (x[1] ? 'ok' : 'bad') + '">' + (x[1] ? '✓' : '✗') + '</span><span>' + x[0] + '</span></div>'; }).join('') + '</div>';
    document.getElementById('dout').innerHTML = h;
    return r;
  }
  function syncSliders() {
    SL.forEach(function (g) { g[1].forEach(function (s) { var i = document.getElementById('s_' + s[0]), o = document.getElementById('o_' + s[0]); if (!i) return; var val = s[5](ST); i.value = val; o.textContent = s[7](val); }); });
    var n = document.querySelectorAll('[data-n]'); for (var i = 0; i < n.length; i++) n[i].classList.toggle('on', +n[i].getAttribute('data-n') === ST.n);
    var pr = document.querySelectorAll('[data-pre]'); for (i = 0; i < pr.length; i++) pr[i].classList.toggle('on', pr[i].getAttribute('data-pre') === ST.preset);
  }
  SC.dashboard = function () {
    var h = '<div class="eyebrow">Dashboard</div><h1>Change an assumption, see the price move</h1><p class="lede">Everything here is recalculated in your browser from the same model as the other screens. Nothing you change is saved or shared.</p><div class="dash"><div class="card ctl"><div class="row"><button class="btn" data-pre="bear">Bear</button><button class="btn on" data-pre="base">Base</button><button class="btn" data-pre="bull">Bull</button><button class="btn" id="reset">Reset all</button></div>';
    SL.forEach(function (g) { h += '<h4>' + g[0] + '</h4>'; g[1].forEach(function (s) { h += '<div class="sl"><label for="s_' + s[0] + '">' + s[1] + '</label><output id="o_' + s[0] + '"></output><input type="range" id="s_' + s[0] + '" min="' + s[2] + '" max="' + s[3] + '" step="' + s[4] + '"></div>'; }); });
    h += '<h4>Forecast length</h4><div class="row"><button class="btn on" data-n="3">3 years</button><button class="btn" data-n="5">5 years</button></div><p class="note">Growth for years beyond FY2029 repeats the FY2029 setting.</p><h4>Export</h4><div class="row"><button class="btn pri hide" id="xl">Download Excel (values)</button></div><p class="note" id="xlmsg">The workbook holds values only, no formulas.</p></div><div id="dout"></div></div>';
    return h;
  };
  function bindDash() {
    SL.forEach(function (g) { g[1].forEach(function (s) { var i = document.getElementById('s_' + s[0]); if (!i) return; i.addEventListener('input', function () { s[6](ST, parseFloat(i.value)); ST.preset = ''; document.getElementById('o_' + s[0]).textContent = s[7](s[5](ST)); var pr = document.querySelectorAll('[data-pre]'); for (var k = 0; k < pr.length; k++) pr[k].classList.remove('on'); renderOut(); }); }); });
    document.querySelectorAll('[data-pre]').forEach(function (b) { b.addEventListener('click', function () { var k = b.getAttribute('data-pre'); ST.p = IM.clone(IM.CASES[k]); ST.preset = k; syncSliders(); renderOut(); }); });
    document.querySelectorAll('[data-n]').forEach(function (b) { b.addEventListener('click', function () { ST.n = +b.getAttribute('data-n'); ST.v.years = ST.n; syncSliders(); renderOut(); }); });
    document.getElementById('reset').addEventListener('click', function () { ST.p = IM.clone(IM.CASES.base); ST.v = IM.clone(IM.VDEF); ST.n = 3; ST.preset = 'base'; syncSliders(); renderOut(); });
    syncSliders(); renderOut();
    var xl = document.getElementById('xl');
    if (typeof XLSX === 'undefined') return;
    var plain = { save: function (o) { return new Promise(function (ok, no) { try { var bl = new Blob([o.data], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), u = URL.createObjectURL(bl), a = document.createElement('a'); a.href = u; a.download = o.filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 2000); ok(); } catch (e) { no(e); } }); } };
    (dlTried ? Promise.resolve(dl) : (window.claude && window.claude.use ? window.claude.use('downloads') : Promise.resolve(plain)).then(function (d) { dl = d || plain; dlTried = true; return dl; }).catch(function () { dlTried = true; return plain; })).then(function (d) {
      if (!d) return; xl.classList.remove('hide');
      xl.addEventListener('click', function () {
        var msg = document.getElementById('xlmsg');
        try {
          var sheets = IM.exportRows(ST.p, ST.v, ST.preset || 'custom'), wb = XLSX.utils.book_new();
          Object.keys(sheets).forEach(function (k) { XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sheets[k]), k.slice(0, 31)); });
          var buf = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
          d.save({ filename: 'Project_Intermission_scenario.xlsx', data: buf }).then(function () { msg.textContent = 'Saved. The workbook holds values only.'; }, function (e) { msg.textContent = e && e.code === 'declined' ? 'Download cancelled.' : 'Download is not available here.'; });
        } catch (e) { msg.textContent = 'Could not build the workbook.'; }
      });
    });
  }

  /* ---------- popover ---------- */
  function closePop() { pop.hidden = true; }
  function openPop(btn) {
    var k = btn.getAttribute('data-k'), p = U.PROV[k]; if (!p) return;
    pop.innerHTML = '<button class="x" aria-label="Close" type="button">×</button><h4>' + U.esc(p.t) + '</h4><div>' + U.stub(p.l) + '</div><p><b>' + U.esc(p.v()) + '</b></p><p>' + U.esc(p.b) + '</p><div class="f">' + U.esc(p.f) + '</div><div class="ref">' + U.esc(IM.WB) + ' › ' + U.esc(p.sheet) + ' › ' + U.esc(p.cell) + '</div><p class="note">Fictional workpaper layout. The Excel export does not follow these positions.</p>';
    pop.hidden = false;
    var r = btn.getBoundingClientRect(), w = pop.offsetWidth, hh = pop.offsetHeight;
    var x = Math.max(12, Math.min(window.innerWidth - w - 12, r.left)), y = r.bottom + 8;
    if (y + hh > window.innerHeight - 12) y = Math.max(12, r.top - hh - 8);
    pop.style.left = x + 'px'; pop.style.top = y + 'px';
    pop.querySelector('.x').addEventListener('click', closePop);
  }

  /* ---------- gates ---------- */
  function bindGates() {
    var store = {}; try { store = JSON.parse(localStorage.getItem('im-gates') || '{}'); } catch (e) { store = {}; }
    function upd() {
      document.querySelectorAll('.gate').forEach(function (g) {
        var bx = g.querySelectorAll('input'), n = 0; bx.forEach(function (b) { if (b.checked) n++; });
        var all = n === bx.length, p = g.querySelector('[data-gp]'), s = all ? 'Closed' : n > 0 ? 'In progress' : g.getAttribute('data-st');
        p.textContent = s; p.className = 'pill ' + (all ? 'p-done' : s === 'Locked' || s === 'Not started' ? 'p-locked' : 'p-open');
        g.classList.toggle('done', all); g.querySelector('[data-gs]').textContent = n + ' of ' + bx.length + ' items done';
      });
    }
    document.querySelectorAll('[data-gi]').forEach(function (b) { b.checked = !!store[b.getAttribute('data-gi')]; b.addEventListener('change', function () { store[b.getAttribute('data-gi')] = b.checked; try { localStorage.setItem('im-gates', JSON.stringify(store)); } catch (e) { } upd(); }); });
    upd();
  }

  /* ---------- map ---------- */
  function bindMap() {
    var panel = document.getElementById('regpanel');
    function sel(k) { document.querySelectorAll('.rg').forEach(function (r) { r.classList.toggle('on', r.getAttribute('data-reg') === k); }); panel.innerHTML = window.regPanel(k); }
    document.querySelectorAll('.rg').forEach(function (r) { var k = r.getAttribute('data-reg'); r.addEventListener('click', function () { sel(k); }); r.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sel(k); } }); });
    sel('nj');
  }

  /* ---------- router ---------- */
  function head(id, html) {
    var meta = META[id] || [id, '', []];
    html = html.replace(/<div class="eyebrow">.*?<\/div>/, '');
    var extra = '';
    if (meta[1] && html.indexOf('class="srcline"') < 0) extra += '<div class="srcline">' + U.esc(meta[1]) + '</div>';
    if (meta[2].length) extra += '<div class="actions">' + meta[2].map(function (a, i) { return '<a class="btn' + (i === 0 ? ' pri' : '') + '" href="' + a[1] + '">' + a[0] + '</a>'; }).join('') + '</div>';
    var crumb = '<div class="crumb">Project Intermission / ' + U.esc(meta[0]) + '</div>';
    var i = html.indexOf('</p>', html.indexOf('class="lede"')), j = html.indexOf('</h1>');
    if (html.indexOf('class="lede"') > -1) html = html.slice(0, i + 4) + extra + html.slice(i + 4); else html = html.slice(0, j + 5) + extra + html.slice(j + 5);
    return crumb + html;
  }
  function route() {
    var id = (location.hash || '').replace('#', ''); if (!SC[id]) id = 'overview';
    closePop();
    main.innerHTML = head(id, SC[id]());
    nav.querySelectorAll('a').forEach(function (a) { if (a.getAttribute('href') === '#' + id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    if (id === 'dashboard') bindDash(); if (id === 'gates') bindGates(); if (id === 'geography') bindMap(); if (id === 'evidence') window.bindEvidence();
    window.scrollTo(0, 0);
  }
  nav.innerHTML = NAV.map(function (n) { return n[0] === '--' ? '<hr>' : '<a href="#' + n[0] + '"><i>' + n[1] + '</i>' + n[2] + '</a>'; }).join('');
  document.addEventListener('click', function (e) {
    var t = e.target, b = t.closest ? t.closest('.prov') : null;
    if (b) { e.stopPropagation(); if (!pop.hidden && pop.getAttribute('data-for') === b.getAttribute('data-k')) { closePop(); return; } pop.setAttribute('data-for', b.getAttribute('data-k')); openPop(b); return; }
    var c = t.closest ? t.closest('[data-src]') : null;
    if (c) { e.preventDefault(); var id = c.getAttribute('data-src'); if ((location.hash || '') !== '#sources') { location.hash = 'sources'; } setTimeout(function () { var el = document.getElementById('src-' + id); if (el) { el.scrollIntoView({ block: 'center' }); el.style.outline = '2px solid var(--accent)'; setTimeout(function () { el.style.outline = ''; }, 1800); } }, 60); return; }
    if (!pop.contains(t)) closePop();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePop(); });
  window.addEventListener('hashchange', route);
  window.addEventListener('scroll', function () { if (!pop.hidden) closePop(); }, { passive: true });
  route();
})();
